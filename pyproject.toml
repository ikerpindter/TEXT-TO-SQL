[project]
name = "txt2sql"
version = "0.1.0"
description = "text-to-SQL con guardrails sobre datos de homebuilders"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=1.60",
    "python-dotenv>=1.0",
    "sqlglot==30.14.0",
]

[project.scripts]
txt2sql = "txt2sql.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/txt2sql"]
